# PAL ∈ PEG, conditional on a strictly real-time multitape TM for PAL,
# via the Kim–Park Lean artifact (PegSeparation, Lean v4.31.0 + Mathlib v4.31.0).
#
# This package is deliberately separate from `../lean` (Lean v4.32.0, no Mathlib):
# the artifact's proofs were checked against a pinned Mathlib and are not moved.
name = "lean-pal"
version = "0.1.0"
defaultTargets = ["PalPeg"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

# Kim–Park, "Separating Parsing Expression Grammars using Cell-Probe Lower Bounds:
# Lean Artifact", v0.1.0 (Zenodo 10.5281/zenodo.22099762), commit c364edb.
[[require]]
name = "PegSeparation"
git = "https://github.com/kimjg1119/peg-separation-artifact"
rev = "c364edb"

[[lean_lib]]
name = "PalPeg"
